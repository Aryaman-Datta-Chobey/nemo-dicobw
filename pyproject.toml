[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-dicobw"
version = "0.0.1"
description = "Nemotron-3-Diarization-conditioned Belle Whisper (DiCoW-style Mandarin target-speaker ASR)"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
