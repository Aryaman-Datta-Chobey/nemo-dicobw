# Fine-tuning Nemotron-3-Diarization on EAR-1 train (ESD-ON), recipe in EXPERIMENTS.md 20261027-nemotron-ft-ear1.
# Generated from NVIDIA-NeMo/Speech examples/speaker_tasks/diarization/conf/neural_diarizer/sortformer_streaming_8spk.yaml
# (= the released model's config) with these overrides: init from the released .nemo, EAR-1 + rehearsal manifests,
# speaker-weighted loss term x0.2 (recipes/diarization/train_nemotron_ft.py; ~30% of the initial loss), MUSAN noise (p 0.3, SNR 5-30 dB), LR 1e-5
# (1/10 of the released schedule's peak), warmup 300, effective batch 8 x 4, 4000 steps, validation + checkpoint every 1000 batches (250 steps), every checkpoint kept, single-GPU strategy auto.
name: nemotron_ft_ear1
num_workers: 8
batch_size: 8
seed: 42
init_from_nemo_model: /mnt/data/models/nvidia__Nemotron-3-Diarization/Nemotron-3-Diarization.nemo
model:
  sample_rate: 16000
  pil_weight: 0.75
  ats_weight: 0.25
  ats_tolerance: 0
  activity_weight: 0.5
  activity_loss:
    _target_: nemo.collections.asr.losses.aux_diarization_loss.ActivityLoss
  phantom_weight: 0.1
  phantom_target: both
  phantom_loss:
    _target_: nemo.collections.asr.losses.aux_diarization_loss.PhantomLoss
    threshold: 0.25
    temperature: 0.5
  max_num_of_spks: 8
  high_resolution: true
  output_subsampling_factor: 1
  streaming_mode: true
  max_causal_tail_len: 222
  causal_tail_prob: 0.5
  min_causal_tail_block_size: 1
  max_causal_tail_block_size: 8
  model_defaults:
    fc_d_model: 512
    tf_d_model: 192
  train_ds:
    manifest_filepath: /mnt/data/manifests/nemotron_ft/ear1_v1/train.json
    validate_manifest_paths: false
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    session_len_sec: 105
    soft_targets: false
    batch_size: ${batch_size}
    shuffle: true
    num_workers: ${num_workers}
    pin_memory: true
    use_lhotse: false
    subsegment_mode: true
    subsegment_single_chunk_min_len_sec: 45
    subsegment_two_chunks_rate: 0.5
    subsegment_two_chunk_min_len_sec: 22
    subsegment_nspk_bias: 1.5
    subsegment_start_guard_sec: 0.25
    subsegment_min_first_spk_sec: 0.5
    subsegment_splice_silence_sec: 0.1
  validation_ds:
    manifest_filepath: /mnt/data/manifests/nemotron_ft/ear1_v1/val.json
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    session_len_sec: -1
    soft_targets: false
    batch_size: 1
    shuffle: false
    num_workers: ${num_workers}
    drop_last: false
    pin_memory: true
    use_lhotse: false
  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    session_len_sec: -1
    soft_targets: false
    batch_size: 32
    shuffle: false
    num_workers: ${num_workers}
    drop_last: false
    pin_memory: true
    use_lhotse: false
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    normalize: NA
    window_size: 0.025
    sample_rate: ${model.sample_rate}
    window_stride: 0.01
    window: hann
    features: 128
    n_fft: 512
    frame_splicing: 1
    dither: 1.0e-05
  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 0
    freq_width: 24
    time_width: 0.02
    mask_value: -15
  sortformer_modules:
    _target_: nemo.collections.asr.modules.sortformer_modules.SortformerModules
    num_spks: ${model.max_num_of_spks}
    dropout_rate: 0.5
    fc_d_model: ${model.model_defaults.fc_d_model}
    tf_d_model: ${model.model_defaults.tf_d_model}
    spkcache_len: 264
    fifo_len: 0
    chunk_len: 264
    spkcache_update_period: 264
    chunk_left_context: 0
    chunk_right_context: 0
    spkcache_sil_frames_per_spk: 1
    scores_add_rnd: 0
    pred_score_threshold: 0.25
    max_index: 99999
    scores_boost_latest: 0.05
    sil_threshold: 0.2
    strong_boost_rate: 0.75
    weak_boost_rate: 1.5
    min_pos_scores_rate: 0.5
    use_learnable_sil_emb: true
  encoder:
    _target_: nemo.collections.asr.modules.TransformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 31
    d_model: ${model.model_defaults.fc_d_model}
    n_heads: 8
    subsampling: feature_stacking
    subsampling_factor: 8
    ff_expansion: 4.0
    self_attention_model: rope
    pos_emb_max_len: 5000
    xscaling: false
    qkv_bias: false
    qk_norm: false
    pre_block_norm: true
    attn_mode: full
    drop_rate: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    sync_max_audio_length: true
  loss:
    _target_: nemo.collections.asr.losses.bce_loss.BCEWithLogitsLoss
    reduction: mean
  lr: 1.0e-05
  optim:
    name: adamw
    lr: ${model.lr}
    betas:
    - 0.9
    - 0.98
    weight_decay: 0.001
    sched:
      name: InverseSquareRootAnnealing
      warmup_steps: 300
      warmup_ratio: null
      min_lr: 1.0e-06
  spk_weighted_weight: 0.2
  augmentor:
    noise:
      prob: 0.3
      manifest_path: /mnt/data/manifests/nemotron_ft/ear1_v1/musan_noise.json
      min_snr_db: 5
      max_snr_db: 30
trainer:
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  max_epochs: 1000
  max_steps: 4000
  num_nodes: 1
  strategy: auto
  accumulate_grad_batches: 4
  deterministic: true
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  limit_train_batches: 1000
  val_check_interval: 1000
exp_manager:
  use_datetime_version: false
  exp_dir: /mnt/data/exp/nemotron/20261027-nemotron-ft-ear1
  name: ${name}
  resume_if_exists: true
  resume_from_checkpoint: null
  resume_ignore_no_checkpoint: true
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  create_wandb_logger: false
  checkpoint_callback_params:
    monitor: val_f1_acc
    mode: max
    save_top_k: -1
    every_n_epochs: 1
  wandb_logger_kwargs:
    resume: true
    name: null
    project: null
